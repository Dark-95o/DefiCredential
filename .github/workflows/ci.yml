name: CloakPass CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Compile Compact Smart Contract (compactc)
      run: npm run compile --workspace=contract

    - name: Run contract spec tests (Vitest)
      run: npm test --workspace=contract

    - name: Run UI test suite (Vitest)
      run: npm test --workspace=ui

    - name: Build frontend application (Vite)
      run: npm run build --workspace=ui
